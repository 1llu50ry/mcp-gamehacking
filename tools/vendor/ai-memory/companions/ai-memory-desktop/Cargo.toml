[workspace]

[package]
name = "ai-memory-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Desktop installer for ai-memory: installs the binary and runs `ai-memory setup --web` in a window"
license = "MIT"

[lib]
name = "ai_memory_desktop"
path = "src/lib.rs"

[[bin]]
name = "ai-memory-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
anyhow = "1"
serde_json = "1"
tauri = { version = "2.12", features = [] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
