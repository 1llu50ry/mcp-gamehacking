# DecompNet toolchain registry.
#
# Every part is downloaded from its upstream release and verified against the pinned sha256
# before anything is extracted. Toolchains are installed under $DECOMPNET_TOOLCHAINS
# (default ~/.local/share/decompnet/toolchains) and mounted read-only into the compile sandbox.
#
# license = "proprietary" entries are supported but never installed without
# `decompnet toolchain install <id> --accept-license`: running them is the operator's decision.
# An empty sha256 means "pin on first install" (trust on first use); the installer records it.
#
# Each part lists the platforms it is for (linux-x86_64, linux-aarch64, macos-x86_64, macos-arm64,
# windows-x86_64). Apple Silicon Macs run the x86_64 builds through Rosetta 2.
# On Windows, a toolchain with only a linux-x86_64 build is installed from that build and runs inside
# WSL 2 (wsl.py); a part for wsl-x86_64 replaces the Linux one there.

[runtime-i386]
name = "32-bit x86 C runtime (glibc 2.44)"
kind = "runtime"
license = "LGPL-2.1-or-later"
source = "Arch Linux archive, lib32-glibc 2.44+r50"
description = "Lets old 32-bit compiler binaries run inside the sandbox without installing multilib on the host."
[[runtime-i386.parts]]
url = "https://archive.archlinux.org/packages/l/lib32-glibc/lib32-glibc-2.44%2Br50%2Bg1848099f063e-1-x86_64.pkg.tar.zst"
sha256 = "a977f9a6a405ab85e594aa9f1230a0b7dddfc33e3de5f2cb66931c92a48931d8"
subdir = "usr/lib32"
platforms = ["linux-x86_64"]
[[runtime-i386.parts]]
# for WSL on Windows: the same runtime from Debian 13 (xz inside, which Windows unpacks; zstd it can't)
url = "https://snapshot.debian.org/archive/debian/20250805T202250Z/pool/main/g/glibc/libc6-i386_2.41-12_amd64.deb"
sha256 = "d3b984867db9cac65d89b75c75f64347964e2837eb53e7782b4349a6c2a5eaaa"
subdir = "usr/lib32"
platforms = ["wsl-x86_64"]

