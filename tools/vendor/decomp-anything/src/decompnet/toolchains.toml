description = "The Clang on this machine compiling C++, for 32-bit Linux programs."
system = true
platform = "Linux"
arch = "x86"
flags = ["-O2", "-fno-pic", "-fno-pie", "-fno-stack-protector", "-fcf-protection=none", "-fno-asynchronous-unwind-tables", "-fno-ident", "-ffunction-sections", "-fdata-sections"]
cmd = ["clang++", "-m32", "-c", "-x", "c++", "{flags}", "-I{include}", "{src}", "-o", "{obj}"]
