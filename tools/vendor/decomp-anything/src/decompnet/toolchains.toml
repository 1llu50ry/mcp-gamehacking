arch = "x86_64"
flags = ["/O2", "/GS-", "/Gy"]
cmd = ["cl", "/nologo", "/c", "{flags}", "/I{include}", "/Fo{obj}", "/TP", "{src}"]

# ---------------------------------------------------------------- Linux programs
# The GCC and Clang already on the machine. A program matches byte for byte only with the compiler version
# and flags that built it (.comment usually says which: the import shows it); a project can point its
# [compiler] cmd at another version. Position-independent programs are imported with -fPIE instead of -fno-pie.

[gcc-linux-x86_64]
name = "GCC (x86-64 Linux)"
kind = "compiler"
license = "GPL-3.0-or-later"
source = "system gcc"
description = "The GCC on this machine, for 64-bit Linux programs."
system = true
platform = "Linux"
arch = "x86_64"
flags = ["-O2", "-fno-pic", "-fno-pie", "-fno-stack-protector", "-fcf-protection=none", "-fno-asynchronous-unwind-tables", "-fno-ident", "-ffunction-sections", "-fdata-sections"]
cmd = ["gcc", "-c", "{flags}", "-I{include}", "{src}", "-o", "{obj}"]

