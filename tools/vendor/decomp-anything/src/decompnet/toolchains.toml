# ---------------------------------------------------------------- Windows (PC) games
# These are compilers already on the machine: no archive is downloaded, so `system = true` skips the
# toolchain store. MinGW-w64 is in every Linux distribution (and in MSYS2 / WSL); real games need the
# compiler that built them (MSVC) for an exact match, which can be supplied with a project's own
# [compiler] cmd as usual.

[mingw-x86_64]
name = "MinGW-w64 GCC (x86-64 Windows target)"
kind = "compiler"
license = "GPL-2.0-or-later"
source = "system x86_64-w64-mingw32-gcc"
description = "GCC for 64-bit Windows, used to match x86-64 PC games. Finds the compiler on PATH."
system = true
download = "https://winlibs.com/"
platform = "Windows"
arch = "x86_64"
flags = ["-O2", "-ffreestanding", "-ffunction-sections", "-fdata-sections", "-fno-asynchronous-unwind-tables",
         "-fno-unwind-tables", "-fno-stack-protector", "-fno-ident", "-fno-pic", "-fno-pie", "-mno-stack-arg-probe"]
cmd = ["x86_64-w64-mingw32-gcc", "-c", "{flags}", "-I{include}", "{src}", "-o", "{obj}"]

[mingw-x86]
name = "MinGW-w64 GCC (32-bit Windows target)"
kind = "compiler"
license = "GPL-2.0-or-later"
source = "system i686-w64-mingw32-gcc"
description = "GCC for 32-bit Windows, used to match x86 PC games. Finds the compiler on PATH."
system = true
download = "https://winlibs.com/"
platform = "Windows"
arch = "x86"
flags = ["-O2", "-ffreestanding", "-ffunction-sections", "-fdata-sections", "-fno-asynchronous-unwind-tables",
         "-fno-unwind-tables", "-fno-stack-protector", "-fno-ident", "-fno-pic", "-fno-pie", "-mno-stack-arg-probe"]
cmd = ["i686-w64-mingw32-gcc", "-c", "{flags}", "-I{include}", "{src}", "-o", "{obj}"]

[mingwxx-x86_64]
name = "MinGW-w64 G++ (x86-64 Windows target)"
kind = "compiler"
license = "GPL-2.0-or-later"
source = "system x86_64-w64-mingw32-g++"
description = "GCC's C++ driver for 64-bit Windows, used to match x86-64 PC programs built as C++."
system = true
download = "https://winlibs.com/"
platform = "Windows"
arch = "x86_64"
flags = ["-O2", "-ffreestanding", "-ffunction-sections", "-fdata-sections", "-fno-asynchronous-unwind-tables",
         "-fno-unwind-tables", "-fno-stack-protector", "-fno-ident", "-fno-pic", "-fno-pie", "-mno-stack-arg-probe"]
cmd = ["x86_64-w64-mingw32-g++", "-c", "-x", "c++", "{flags}", "-I{include}", "{src}", "-o", "{obj}"]

[mingwxx-x86]
name = "MinGW-w64 G++ (32-bit Windows target)"
kind = "compiler"
license = "GPL-2.0-or-later"
source = "system i686-w64-mingw32-g++"
description = "GCC's C++ driver for 32-bit Windows, used to match x86 PC programs built as C++."
system = true
download = "https://winlibs.com/"
platform = "Windows"
arch = "x86"
flags = ["-O2", "-ffreestanding", "-ffunction-sections", "-fdata-sections", "-fno-asynchronous-unwind-tables",
         "-fno-unwind-tables", "-fno-stack-protector", "-fno-ident", "-fno-pic", "-fno-pie", "-mno-stack-arg-probe"]
cmd = ["i686-w64-mingw32-g++", "-c", "-x", "c++", "{flags}", "-I{include}", "{src}", "-o", "{obj}"]

[clang-cl-x86_64]
name = "Clang (clang-cl, x86-64 Windows target)"
kind = "compiler"
license = "Apache-2.0 WITH LLVM-exception"
source = "system clang-cl"
description = "LLVM's MSVC-compatible driver, often a closer match for code built with MSVC. Finds clang-cl on PATH."
system = true
download = "https://github.com/llvm/llvm-project/releases/latest"
platform = "Windows"
arch = "x86_64"
flags = ["/O2", "/GS-"]
cmd = ["clang-cl", "/c", "{flags}", "/TC", "/I{include}", "/Fo{obj}", "--", "{src}"]

[clang-cl-x86]
name = "Clang (clang-cl, 32-bit Windows target)"
kind = "compiler"
license = "Apache-2.0 WITH LLVM-exception"
source = "system clang-cl (i686)"
description = "LLVM's 32-bit MSVC-compatible driver for x86 PC games. Finds clang-cl on PATH."
system = true
download = "https://github.com/llvm/llvm-project/releases/latest"
platform = "Windows"
arch = "x86"
flags = ["/O2", "/GS-"]
cmd = ["clang-cl", "--target=i686-pc-windows-msvc", "/c", "{flags}", "/TC", "/I{include}", "/Fo{obj}", "--", "{src}"]

[clang-clxx-x86_64]
name = "Clang (clang-cl, x86-64 Windows target, C++)"
kind = "compiler"
license = "Apache-2.0 WITH LLVM-exception"
source = "system clang-cl"
description = "LLVM's MSVC-compatible C++ driver, used to match x86-64 programs built with MSVC as C++."
system = true
download = "https://github.com/llvm/llvm-project/releases/latest"
platform = "Windows"
arch = "x86_64"
flags = ["/O2", "/GS-"]
cmd = ["clang-cl", "/c", "{flags}", "/TP", "/I{include}", "/Fo{obj}", "--", "{src}"]

[clang-clxx-x86]
name = "Clang (clang-cl, 32-bit Windows target, C++)"
kind = "compiler"
license = "Apache-2.0 WITH LLVM-exception"
source = "system clang-cl (i686)"
description = "LLVM's 32-bit MSVC-compatible C++ driver, used to match x86 programs built with MSVC as C++."
system = true
download = "https://github.com/llvm/llvm-project/releases/latest"
platform = "Windows"
arch = "x86"
flags = ["/O2", "/GS-"]
cmd = ["clang-cl", "--target=i686-pc-windows-msvc", "/c", "{flags}", "/TP", "/I{include}", "/Fo{obj}", "--", "{src}"]

# Microsoft's own compiler, when it is installed. A game built with VC6/VC8/... matches byte for byte only
# with the same cl.exe; clang-cl is the free near-relative (see clang-cl-*). Put the cl.exe that targets
# the game's architecture on PATH (the x86 one for a 32-bit game) or point the project's [compiler] cmd at it.

[msvc-x86]
name = "Microsoft Visual C++ (cl.exe, 32-bit target)"
kind = "compiler"
license = "proprietary"
source = "system cl.exe (Visual Studio)"
description = "The compiler many Windows games were built with. Finds the x86-targeting cl.exe on PATH."
system = true
download = "https://visualstudio.microsoft.com/vs/older-downloads/"
platform = "Windows"
arch = "x86"
flags = ["/O2", "/GS-", "/Gy"]
cmd = ["cl", "/nologo", "/c", "{flags}", "/I{include}", "/Fo{obj}", "/TC", "{src}"]

[msvcxx-x86]
name = "Microsoft Visual C++ (cl.exe, 32-bit target, C++)"
kind = "compiler"
license = "proprietary"
source = "system cl.exe (Visual Studio)"
description = "The C++ compiler many Windows games were built with. Finds the x86-targeting cl.exe on PATH."
system = true
download = "https://visualstudio.microsoft.com/vs/older-downloads/"
platform = "Windows"
arch = "x86"
flags = ["/O2", "/GS-", "/Gy"]
cmd = ["cl", "/nologo", "/c", "{flags}", "/I{include}", "/Fo{obj}", "/TP", "{src}"]

[msvc-x86_64]
name = "Microsoft Visual C++ (cl.exe, 64-bit target)"
kind = "compiler"
license = "proprietary"
source = "system cl.exe (Visual Studio)"
description = "The compiler many 64-bit Windows games were built with. Finds cl.exe on PATH."
system = true
download = "https://visualstudio.microsoft.com/"
platform = "Windows"
arch = "x86_64"
flags = ["/O2", "/GS-", "/Gy"]
cmd = ["cl", "/nologo", "/c", "{flags}", "/I{include}", "/Fo{obj}", "/TC", "{src}"]

[msvcxx-x86_64]
name = "Microsoft Visual C++ (cl.exe, 64-bit target, C++)"
kind = "compiler"
license = "proprietary"
source = "system cl.exe (Visual Studio)"
description = "The C++ compiler many 64-bit Windows games were built with. Finds cl.exe on PATH."
