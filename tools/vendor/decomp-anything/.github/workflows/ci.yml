name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Lint
        run: uv run ruff check .

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --group dev
      # Tests that need a period toolchain (gcc-2.7.2-kmc, CodeWarrior, agbcc, ...) skip themselves with a
      # reason when it isn't installed; `decompnet toolchain install <id>` is all CI needs to turn them on.
      - name: Test
        run: uv run pytest -q
