name = "Demo Quest 64"
slug = "demo-n64"
description = "The demo game built for the N64 with the KMC-compatible GCC 2.7.2: big-endian MIPS, the way many N64 games were made."

[legal]
basis = "own-code"
license = "CC0-1.0"
notes = "Demo Quest was written for DecompNet; its full source is in original/."

[compiler]
toolchain = "gcc-2.7.2-kmc"   # pinned in decompnet/toolchains.toml; flags default to the registry's N64 set
timeout = 15

[target]
objects = ["target/game.o"]
build_from = "original/game.c"   # own code: build the target with the same sandboxed toolchain

[context]
file = "include/context.h"
