# CI gate (REFACTOR-TST-013): type-check + lint + full test suite on every PR
# and on pushes to main. Coverage thresholds (vitest.config.ts, 70/70/70/60)
# are enforced whenever coverage runs, but are tracked non-blocking until the
# suite reaches the floor (current totals 2026-08-10: Stmts 57.31 / Br 54.34 /
# Fn 63.22 / Ln 58.41 — see docs/testing.md §7). Flip to blocking in a
# follow-up task once the floor is met (see "Coverage report" step below).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # Mirror release.yml: workspaces + overrides + native deps
      # (better-sqlite3, tree-sitter) require --legacy-peer-deps.
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      # FIX-393: the reference-emission suite parses real source with
      # tree-sitter WASM grammars. kotlin/swift/dart/vue ship NO prebuilt
      # WASM in node_modules — dist/grammars is generated by
      # scripts/copy-grammar-wasm.sh (also part of `npm run build`). Without
      # this step those grammars drop out of the registry and .kt/.swift
      # files fall through to the generic regex visitor (which emits no
      # references), failing the reference-emission gate with empty arrays.
      # Build the grammars so the test environment matches production.
      - name: Build grammar WASMs (dist/grammars)
        run: bash scripts/copy-grammar-wasm.sh

      # Full suite (unit + integration + e2e + perf via vitest --run) — the
      # blocking merge gate. REFACTOR-TST-012 verified 157 files / 2287 tests.
      - name: Test
        run: npm run test

      # Coverage gate (enforces the TST-003 vitest.config.ts thresholds):
      # `--coverage` triggers threshold evaluation and the v8 provider has no
      # warn-only mode (a missed floor exits 1). The suite is BELOW the floor,
      # so this step is intentionally non-blocking (continue-on-error) until
      # totals >= 70/70/70/60 — the real numbers are visible in the log and
      # coverage artifacts are uploaded for tracking. DO NOT remove this step;
      # to make coverage blocking: remove `continue-on-error` here AND set
      # `coverage.enabled: true` in vitest.config.ts (single follow-up task).
      - name: Coverage report (tracking — non-blocking until floor met)
        continue-on-error: true
        run: npm run test -- --coverage

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
