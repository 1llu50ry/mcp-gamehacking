# DEPRECATED (TASK-086): npm publishing is handled by release.yml (tag push `v*`).
#
# This workflow previously published on `release: created`, which could race
# release.yml (tag push) and double-publish the same version. Publishing is
# consolidated on the tag-push trigger in release.yml — this file is kept as a
# no-op so the workflow file remains referenced but never publishes.
name: Publish to npm (deprecated — see release.yml)
on:
  release:
    types: [created]
jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - name: Skip (publishing moved to release.yml)
        run: echo "Publishing is handled by release.yml on tag push (v*). This workflow is intentionally a no-op."
