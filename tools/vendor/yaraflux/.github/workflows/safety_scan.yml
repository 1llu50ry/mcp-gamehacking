name: Dependency Vulnerability Scan
# `push` alone never fires for a pull request opened from a fork, so the audit
# and lock-drift gates below could not see exactly the contributions most in
# need of them. `pull_request` runs both against the PR merge commit.
#
# `push` is scoped to the integration branches (matching ci.yml) rather than
# left unfiltered: an unfiltered `push` plus `pull_request` runs the whole scan
# twice for every same-repo PR branch. This way each commit is scanned once --
# on its PR before merge, and on main/develop after.
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  # Supersede an in-flight scan when a branch is pushed again. head_ref is set
  # for pull_request and empty for push, so pair it with ref_name (the short
  # branch name) -- github.ref would be "refs/heads/x" here and "x" there, and
  # the two would never land in the same group.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # Nothing after the checkout talks to git, and the audit step runs a
          # third-party composite action in this same workspace.
          persist-credentials: false

      # requirements-lock.txt / requirements-dev-lock.txt are the canonical
      # dependency set: compiled by `make lock-requirements` from
      # pyproject.toml (every dependency group, constrained by
      # requirements.txt) with a hash for every transitive package, and
      # installed verbatim by the Docker build under --require-hashes. The
      # locks therefore cover everything requirements*.txt and pyproject.toml
      # declare, and auditing them scans the exact closure that ships instead
      # of a hypothetical fresh resolution of the loose floors. The
      # `lock-drift` job below guarantees the locks stay derived from those
      # sources. require-hashes also disables dependency resolution, so
      # pip-audit checks the pinned set as-is.
      - name: Run pip-audit to check for vulnerabilities
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266  # v1.1.0
        with:
          inputs: >-
            requirements-lock.txt
            requirements-dev-lock.txt
          require-hashes: true
          # GHSA-wj6h-64fc-37mp (aka CVE-2024-23342 / PYSEC-2026-1325): Minerva timing
          # attack on P-256 in python-ecdsa. `ecdsa` is a hard transitive dependency of
          # python-jose (`ecdsa!=0.15`), every published version is affected, and upstream
          # has declared side-channel attacks out of scope with no planned fix -- so there
          # is no version to upgrade to. YaraFlux signs JWTs with HS256 (symmetric, see
          # config.JWT_ALGORITHM) through the `cryptography` backend and never calls the
          # affected ECDSA APIs. Drop this ignore if a fixed `ecdsa` release ever ships,
          # if python-jose stops requiring it, or if JWT_ALGORITHM moves to an EC curve.
          ignore-vulns: GHSA-wj6h-64fc-37mp

  # The audit above (and the Docker build) are only as good as the lock files,
  # so prove they are still derivable from pyproject.toml + requirements.txt:
  # rerun the same compile the Makefile uses and fail on any difference.
  # `uv pip compile` reuses the versions already pinned in its output file, so
  # this does not churn when PyPI merely publishes newer releases -- it fails
  # when the declared inputs changed without `make lock-requirements` being
  # rerun, and when a lock names a version those inputs can no longer resolve
  # to (a floor it does not satisfy, a package no longer declared anywhere).
  #
  # Scope, precisely: this detects drift from the declared inputs. It is not
  # tamper-evidence. Because the compile treats the committed pins as
  # preferences, hand-editing a lock to some *other* real release that still
  # satisfies the declared floors is reproduced by the recompile and passes
  # here. What makes a forged pin fail is --require-hashes in the audit step
  # and the Docker build: a hash that does not match the artifact on PyPI is
  # rejected at install time.
  lock-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.13'

      # Byte-identical compile output is only guaranteed within a uv version,
      # so pin it. Bump this together with a `make lock-requirements` rerun.
      - name: Install uv
        run: pip install uv==0.12.0

      - name: Regenerate requirement locks
        run: make lock-requirements

      - name: Fail if committed locks are stale
        run: |
          if ! git diff --exit-code -- requirements-lock.txt requirements-dev-lock.txt; then
            echo "::error::requirements-lock.txt / requirements-dev-lock.txt no longer match pyproject.toml + requirements.txt."
            echo "Run 'make lock-requirements' with uv==0.12.0 and commit the updated lock files."
            exit 1
          fi
