name: Update GitHub Actions Dependencies

on:
  schedule:
    - cron: "0 0 * * 1"  # Runs every Monday
  workflow_dispatch:      # Manual trigger option

jobs:
  update-actions:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # Required to modify repository contents
      pull-requests: write    # Required to create PRs
      actions: read           # Required to read workflow files

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Update GitHub Actions
        uses: ThreatFlux/githubWorkFlowChecker@afa5343c5dbae66fbf7e9e35765e045c93bff630  # v1.20250907.1
        with:
          owner: ${{ github.repository_owner }}
          repo-name: ${{ github.event.repository.name }}
          labels: "dependencies,security"
          token: ${{ secrets.GIT_TOKEN }}
