name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 18 is EOL (Apr 2025). Package.json also declares node >=18 but
        # the mesh e2e tests spawn a cold server with a 4,200-skill library;
        # on Node 18 that reliably crosses the 15 s rpc timeout in CI.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci || npm install
      - run: npx tsc
      - run: node --test tests/*.test.mjs

  smoke:
    name: smoke (MCP tools/list)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci || npm install
      - run: npx tsc
      - name: tools/list smoke test
        run: |
          # Send a proper MCP handshake (initialize + initialized notification)
          # before tools/list — the SDK rejects pre-handshake method calls.
          # Parse the response with jq instead of counting "name" strings so
          # fields like serverInfo.name don't inflate the count.
          OUT=$(printf '%s\n%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | timeout 30 node dist/index.js 2>/dev/null || true)
          COUNT=$(printf '%s\n' "$OUT" \
            | awk '/^\{.*"id":2/ { print; exit }' \
            | jq -r '.result.tools | length' 2>/dev/null || echo 0)
          echo "tools/list returned $COUNT tools"
          test "$COUNT" -ge 50 || { echo "expected >= 50 tools"; echo "--- raw output ---"; echo "$OUT" | head -40; exit 1; }

  format:
    name: format (prettier check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci || npm install
      - name: install prettier
        run: npm install --no-save prettier@3
      - name: prettier --check
        run: npx prettier --check "src/**/*.ts" "tests/**/*.mjs"
        continue-on-error: true
