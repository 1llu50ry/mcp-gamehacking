name: Feature request
description: Suggest a new MCP tool, workflow, or capability.
title: "[feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      placeholder: "What are you trying to accomplish?"
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      placeholder: "A new tool `foo_bar` that..."
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
